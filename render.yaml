services:
  - type: web
    name: revenue-autopilot-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: sqlite:////app/data/revenue_autopilot.db
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://revenue-autopilott.vercel.app,https://revenue-autopilot.vercel.app,http://localhost:5173
      - key: HIGH_VALUE_THRESHOLD
        value: "50000"
      - key: HIGH_RISK_THRESHOLD
        value: "0.75"
      - key: LOW_CONFIDENCE_THRESHOLD
        value: "0.55"
